<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 2 Reel Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071019; --card: #0D1B26; --line: #1A2A36; --white: #F2F8F8;
    --teal: #34D5C3; --coral: #FE8F7B; --yellow: #FFC857; --muted: #8A9BA8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #02070c; font-family: 'Figtree', sans-serif; color: var(--white);
         display: flex; justify-content: center; padding: 48px 0; }
  .frame { width: 1080px; height: 1920px; background: var(--bg); position: relative; overflow: hidden;
           padding: 240px 80px 300px; display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { position: absolute; top: 80px; left: 80px; display: flex; align-items: center; gap: 14px;
           font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
  .ep { position: absolute; top: 84px; right: 80px; display: flex; align-items: center; gap: 12px;
        border: 2px solid rgba(52,213,195,.45); background: var(--card); color: var(--teal);
        border-radius: 999px; padding: 12px 26px; font-size: 26px; font-weight: 700; letter-spacing: 3px; }
  .chips { display: flex; gap: 14px; margin-bottom: 60px; }
  .chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 12px 26px;
          font-size: 26px; font-weight: 600; }
  .chip.teal { border-color: rgba(52,213,195,.45); color: var(--teal); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -4px; line-height: 0.98; }
  .time { font-size: 260px; letter-spacing: -10px; }
  .h2 { font-size: 116px; color: var(--coral); margin-top: 10px; }
  .panel { margin-top: 80px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 40px 44px; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
  .tx { font-size: 34px; line-height: 1.45; color: var(--white); }
  .tx .f { background: rgba(254,143,123,.18); border: 2px solid var(--coral); color: var(--coral);
           border-radius: 8px; padding: 0 8px; font-weight: 600; }
  .cursor { display: inline-block; width: 4px; height: 38px; background: var(--muted); vertical-align: -6px; margin-left: 6px; }
  .silence { display: inline-flex; align-items: center; gap: 12px; margin-top: 28px; color: var(--coral);
             font-size: 26px; font-weight: 700; }
  .silence::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--coral); }
  .timerrow { display: flex; justify-content: space-between; font-size: 28px; font-weight: 700; margin-top: 34px; }
  .bar { height: 16px; background: #12232F; border-radius: 999px; overflow: hidden; margin-top: 14px; }
  .bar span { display: block; width: 53%; height: 100%; background: var(--coral); border-radius: 999px; }
  .play { position: absolute; left: 50%; bottom: 360px; transform: translateX(-50%);
          width: 132px; height: 132px; border-radius: 50%; background: rgba(242,248,248,.08);
          border: 2px solid rgba(242,248,248,.2); display: flex; align-items: center; justify-content: center; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; display: flex; align-items: flex-end;
          gap: 8px; padding: 0 40px 60px; opacity: .55; }
  .wave i { flex: 1; background: #12232F; border-radius: 4px; }
</style>
</head>
<body>
<section class="frame">
  <div class="brand"><svg width="52" height="52" viewBox="0 0 48 48"><path d="M8 4h32a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H20l-10 8v-8H8a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6z" fill="#34D5C3"/><g fill="#071019"><rect x="13" y="16" width="4" height="10" rx="2"/><rect x="20" y="11" width="4" height="20" rx="2"/><rect x="27" y="14" width="4" height="14" rx="2"/><rect x="34" y="18" width="4" height="6" rx="2"/></g></svg>TalkiePrep</div>
  <div class="ep"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M2 1l15 9-15 9z" fill="#34D5C3"/></svg>EP. 01</div>

  <div class="chips"><span class="chip teal">IELTS</span><span class="chip">Speaking Part 2</span></div>
  <h1 class="time">1:04.</h1>
  <h1 class="h2">Nothing left to say.</h1>

  <div class="panel">
    <div class="label">Practice transcript · live</div>
    <p class="tx">…I like it because it is, <span class="f">uh</span>, very relaxing. And… <span class="f">like</span>… yeah.<span class="cursor"></span></p>
    <div class="silence">4 seconds of silence and counting</div>
    <div class="timerrow"><span class="c" style="color:var(--coral)">1:04</span><span style="color:var(--muted)">2:00</span></div>
    <div class="bar"><span></span></div>
  </div>

  <div class="play"><svg width="48" height="54" viewBox="0 0 18 20"><path d="M3 1l14 9-14 9z" fill="#F2F8F8"/></svg></div>
  <div class="wave"></div>
</section>
<script>
  document.querySelectorAll('.wave').forEach(function (w) {
    for (var i = 0; i < 64; i++) {
      var b = document.createElement('i');
      b.style.height = (18 + Math.abs(Math.sin(i * 0.37) * 70) + Math.abs(Math.sin(i * 1.3) * 34)) + 'px';
      w.appendChild(b);
    }
  });
</script>
</body>
</html>
