<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 2 Reel Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071019; --card: #0D1B26; --line: #1A2A36; --white: #F2F8F8;
    --teal: #34D5C3; --coral: #FE8F7B; --yellow: #FFC857; --muted: #8A9BA8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #02070c; font-family: 'Figtree', sans-serif; color: var(--white);
         display: flex; justify-content: center; padding: 48px 0; }
  .frame { width: 1080px; height: 1920px; background: var(--bg); position: relative; overflow: hidden;
           padding: 200px 80px 300px; display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { position: absolute; top: 80px; left: 80px; display: flex; align-items: center; gap: 14px;
           font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
  .ep { position: absolute; top: 82px; right: 80px; display: flex; align-items: center; gap: 12px;
        border: 2px solid rgba(52,213,195,.45); color: var(--teal); border-radius: 999px; padding: 10px 24px;
        font-size: 26px; font-weight: 700; letter-spacing: 3px; }
  .chips { display: flex; gap: 14px; margin-bottom: 44px; }
  .chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 12px 26px;
          font-size: 28px; font-weight: 600; }
  .chip.teal { border-color: rgba(52,213,195,.45); color: var(--teal); }
  .chip.coral { border-color: rgba(254,143,123,.5); color: var(--coral); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -4px; line-height: .98; }
  .clock { font-size: 260px; letter-spacing: -10px; }
  .big { font-size: 124px; color: var(--coral); margin-top: 10px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 40px 44px; margin-top: 70px; }
  .label { font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
  .tx { font-size: 36px; line-height: 1.55; }
  .hl { background: rgba(254,143,123,.18); border: 2px solid var(--coral); color: var(--coral);
        border-radius: 8px; padding: 0 8px; font-weight: 600; }
  .timerrow { display: flex; justify-content: space-between; font-size: 30px; font-weight: 700; margin-top: 34px; }
  .bar { height: 16px; background: #12232F; border-radius: 999px; overflow: hidden; margin-top: 14px; }
  .bar span { display: block; height: 100%; width: 53%; background: var(--coral); border-radius: 999px; }
  .spacer { flex: 1; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 220px; display: flex; align-items: flex-end;
          gap: 8px; padding: 0 40px 60px; opacity: .55; }
  .wave i { flex: 1; background: #12232F; border-radius: 4px; }
</style>
</head>
<body>
<section class="frame">
  <div class="brand"><svg width="54" height="54" viewBox="0 0 48 48"><path d="M8 4h32a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H20l-10 8v-8H8a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6z" fill="#34D5C3"/><g fill="#071019"><rect x="13" y="16" width="4" height="10" rx="2"/><rect x="20" y="11" width="4" height="20" rx="2"/><rect x="27" y="14" width="4" height="14" rx="2"/><rect x="34" y="18" width="4" height="6" rx="2"/></g></svg>TalkiePrep</div>
  <div class="ep"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 3l14 8-14 8z" fill="#34D5C3"/></svg>EP. 01</div>

  <div class="spacer"></div>
  <div class="chips"><span class="chip teal">IELTS</span><span class="chip">Speaking Part 2</span></div>
  <h1 class="clock">1:04.</h1>
  <h1 class="big">Nothing left<br>to say.</h1>

  <div class="card">
    <div class="label">Practice transcript</div>
    <p class="tx">…it is, <span class="hl">uh</span>, very relaxing. And… <span class="hl">like</span>… yeah.</p>
    <div style="margin-top:28px"><span class="chip coral" style="display:inline-block">● 4 seconds of silence and counting</span></div>
    <div class="timerrow"><span style="color:var(--coral)">1:04</span><span style="color:var(--muted)">2:00</span></div>
    <div class="bar"><span></span></div>
  </div>

  <p style="font-size:34px;color:var(--muted);margin-top:56px;line-height:1.4">It's not your ideas. <span style="color:var(--teal);font-weight:700">It's your prep.</span></p>
  <div class="spacer"></div>
  <div class="wave"></div>
</section>
<script>
  document.querySelectorAll('.wave').forEach(function (w) {
    for (var i = 0; i < 64; i++) {
      var b = document.createElement('i');
      b.style.height = (24 + Math.abs(Math.sin(i * 0.37) * 80) + Math.abs(Math.sin(i * 1.3) * 40)) + 'px';
      w.appendChild(b);
    }
  });
</script>
</body>
</html>
